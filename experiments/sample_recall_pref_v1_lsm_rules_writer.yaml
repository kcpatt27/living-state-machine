name: recall_pref_v1_lsm_rules_writer
task:
  name: recall_pref_v1
  num_items: 20
  distractor_turns: 30
system:
  kind: lsm
  backend: ollama
  model: qwen2.5:14b-instruct-q4_K_M
  top_k: 4
  min_score: 0.15
  recent_context_window: 8
  memory:
    kind: memory
  habituation:
    tau_seconds: 3600.0
    eta: 1.0
    damping_strength: 0.35
  association:
    eta: 0.25
    lambda_per_second: 1.0e-5
    boost_strength: 0.35
  writer:
    kind: rules
    min_tokens: 4
    min_chars: 12
    min_fraction_alpha: 0.5
    min_novelty: 0.10
    assistant_requires_durable_hit: true
ablation:
  state_enabled: true
  memory_enabled: true
  habituation_enabled: true
  association_enabled: true
  writer_enabled: true
embedder:
  kind: fastembed
  model: BAAI/bge-small-en-v1.5
run:
  seeds: [0, 1, 2]
