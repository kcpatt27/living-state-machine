[project]
name = "lsm"
version = "0.1.0"
description = "Living State Machine: a Stentor-inspired cognitive wrapper around local LLMs"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "reishi" }]
keywords = [
    "llm",
    "recurrent",
    "memory",
    "habituation",
    "association",
    "stentor",
    "agent",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.12",
    "rich>=13.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlite-utils>=3.37",
    "lancedb>=0.14",
    "pyarrow>=17",
    "fastembed>=0.4",
    "httpx>=0.27",
    "ollama>=0.4",
    "pyyaml>=6.0",
    "numpy>=1.26,<2.2",
    "cryptography>=43",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
research = [
    "torch>=2.4",
    "transformers>=4.45",
    "accelerate>=1.0",
    "peft>=0.13",
    "datasets>=3.0",
    "tokenizers>=0.20",
    "bitsandbytes>=0.44; platform_system != 'Darwin'",
    "wandb>=0.18",
    "einops>=0.8",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "black>=24.10",
    "pyright>=1.1.385",
    "pre-commit>=4.0",
    "httpx>=0.27",
]

[project.scripts]
lsm = "lsm.cli.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lsm"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["lsm", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line too long (black handles this)
    "B008", # function call in default argument (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pyright]
include = ["lsm", "tests"]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=lsm",
    "--cov-report=term-missing",
]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "gpu: requires a GPU",
    "integration: integration tests that hit Ollama",
]
