name: recall_pref_v1_lsm_no_assoc
task:
  name: recall_pref_v1
  num_items: 20
  distractor_turns: 30
system:
  kind: lsm
  backend: ollama
  model: qwen2.5:14b-instruct-q4_K_M
  top_k: 4
  min_score: 0.15
  recent_context_window: 8
  memory:
    kind: memory
  habituation:
    tau_seconds: 3600.0
    eta: 1.0
    damping_strength: 0.35
ablation:
  state_enabled: true
  memory_enabled: true
  habituation_enabled: true
  association_enabled: false
embedder:
  kind: fastembed
  model: BAAI/bge-small-en-v1.5
run:
  seeds: [0, 1, 2]
